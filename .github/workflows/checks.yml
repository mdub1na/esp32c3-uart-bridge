name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements-host.txt
      - run: python -m unittest discover -s tests -p 'test_host*.py' -v
      - run: sh tests/run_native.sh

  firmware:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.2@sha256:05cbfc42ed2e987b8026722c15bf1d8523d3e4fd1b4ac04d2e4056f5e0918b99
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, loopback, luatos, luatos-recovery]
    steps:
      - uses: actions/checkout@v4
      - name: Build the locked firmware mode
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          sh scripts/build.sh "${{ matrix.mode }}"
